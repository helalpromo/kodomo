<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Mart Enterprise - Invoice Manager</title>
    <!-- Tailwind CSS for modern UI styling -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        @media print {
            body * {
                visibility: hidden;
            }
            #printableInvoice, #printableInvoice * {
                visibility: visible;
            }
            #printableInvoice {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                background: white;
                padding: 20px;
            }
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <!-- Login Screen -->
    <div id="loginScreen" class="min-h-screen flex items-center justify-center bg-gray-900 px-4">
        <div class="bg-white rounded-lg shadow-xl p-8 max-w-md w-full">
            <h2 class="text-2xl font-bold text-center text-blue-600 mb-2">Good Mart Enterprise</h2>
            <p class="text-center text-gray-500 mb-6 text-sm">দয়া করে আপনার লগইন তথ্য দিন</p>
            
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">ইউজারনেম (Username):</label>
                    <input type="text" id="username" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="ইউজারনেম লিখুন">
                </div>
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">পাসওয়ার্ড (Password):</label>
                    <input type="password" id="password" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline" placeholder="পাসওয়ার্ড লিখুন">
                </div>
                <p id="loginError" class="text-red-500 text-xs hidden font-bold text-center">ভুল ইউজারনেম অথবা পাসওয়ার্ড!</p>
                <div>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded w-full focus:outline-none focus:shadow-outline">
                        লগইন করুন
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Main App Container -->
    <div id="mainApp" class="container mx-auto px-4 py-8 max-w-6xl hidden">
        <div class="flex justify-between items-center mb-6 no-print">
            <div>
                <h1 class="text-3xl font-bold text-blue-600">Good Mart Enterprise</h1>
                <p class="text-gray-600">ইনভয়েস এবং লেনদেন ম্যানেজমেন্ট সিস্টেম</p>
            </div>
            <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded text-sm">লগআউট</button>
        </div>

        <!-- Form Section -->
        <div class="bg-white shadow-md rounded-lg p-6 mb-8 no-print">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">নতুন ইনভয়েস এন্ট্রি করুন</h2>
            <form id="invoiceForm" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                
                <!-- Date -->
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">তারিখ (Date):</label>
                    <input type="date" id="date" required class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                </div>

                <!-- Brand / Menu Dropdown -->
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">ব্র্যান্ড/মেনু (Brand/Menu):</label>
                    <select id="brandSelect" class="shadow border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                        <option value="Kodomo">Kodomo</option>
                        <option value="Fogg">Fogg</option>
                    </select>
                </div>

                <!-- Invoice Type Dropdown -->
                <div>
                    <label class="block text-gray-700 text-sm font-bold mb-2">লেন
